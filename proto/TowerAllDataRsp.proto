syntax = "proto3";

import "TowerCurLevelRecord.proto";
import "TowerFloorRecord.proto";
import "TowerMonthlyBrief.proto";

message TowerAllDataRsp {
	enum _TowerSkipFloorState {
		_TOWER_SKIP_FLOOR_STATE_TOWER_SKIP_FLOOR_STATE_NONE = 0;
		_TOWER_SKIP_FLOOR_STATE_TOWER_SKIP_FLOOR_STATE_CAN_NOT_SKIP = 1;
		_TOWER_SKIP_FLOOR_STATE_TOWER_SKIP_FLOOR_STATE_HAS_REWARD = 2;
		_TOWER_SKIP_FLOOR_STATE_TOWER_SKIP_FLOOR_STATE_TAKEN_REWARD = 3;
	}

	repeated TowerFloorRecord tower_floor_record_list = 7;
	TowerMonthlyBrief last_schedule_monthly_brief = 917;
	TowerCurLevelRecord cur_level_record = 15;
	map<uint32, uint32> floor_open_time_map = 8;
	map<uint32, uint32> skip_floor_granted_reward_item_map = 13;
	TowerMonthlyBrief monthly_brief = 11;
	int32 retcode = 6;
	uint32 commemorative_reward_id = 14;
	uint32 valid_tower_record_num = 1;
	bool is_finished_entrance_floor = 4;
	bool is_first_interact = 10;
	uint32 skip_to_floor_index = 9;
	uint32 tower_schedule_id = 5;
	uint32 schedule_start_time = 1633;
	uint32 ODHFIIJNPAD = 12;
	_TowerSkipFloorState _tower_skip_floor_state = 755;
	uint32 next_schedule_change_time = 3;
	uint32 EAIHABNLBJF = 2;
}
syntax = "proto3";

import "MonsterChessV2RecordTeamInfo.proto";

message MonsterChessV2RecordInfo {
	repeated uint32 _win_round_list = 15;
	repeated _MonsterChessV2RecordTeamInfo team_info_list = 14;
	repeated uint32 _artifact_id_list = 3;
	bool _is_infinite = 7;
	uint32 _infinite_win_num = 2;
	uint32 timestamp = 11;
}

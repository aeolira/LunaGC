syntax = "proto3";

import "Vector.proto";

message ScenePlayerSoundNotify {
	enum PlaySoundType {
		PLAY_SOUND_TYPE_PLAY_SOUND_NONE = 0;
		PLAY_SOUND_TYPE_PLAY_SOUND_START = 1;
		PLAY_SOUND_TYPE_PLAY_SOUND_STOP = 2;
	}

	Vector play_pos = 6;
	string sound_name = 1;
	PlaySoundType play_type = 13;
}

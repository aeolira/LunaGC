syntax = "proto3";

import "FurnitureMakeBeHelpedData.proto";
import "FurnitureMakeMakeInfo.proto";
import "FurnitureMakeSlot.proto";
import "LDCPLJCOFKF.proto";
import "NOEPFAGBAOD.proto";

message FurnitureMakeRsp {
	repeated NOEPFAGBAOD LFACJDGJPPB = 14;
	repeated FurnitureMakeMakeInfo make_info_list = 4;
	repeated FurnitureMakeBeHelpedData helped_data_list = 1;
	FurnitureMakeSlot furniture_make_slot = 5;
	repeated LDCPLJCOFKF GAGGBGNPNBG = 12;
	uint32 _furniture_make_slot_num = 8;
	int32 retcode = 11;
}

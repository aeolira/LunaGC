syntax = "proto3";




message LockedPersonallineData {
	enum LockReason {
		LOCK_REASON_LEVEL = 0;
		LOCK_REASON_QUEST = 1;
	}

	message _QuestParam {
		uint32 chapter_id = 11;
		uint32 quest_id = 10;
	}

	LockReason lock_reason = 10;
	uint32 personal_line_id = 1;
	oneof param {
		uint32 chapter_id = 15;
		_QuestParam quest_param = 7;
		uint32 level = 8;
	}
}

syntax = "proto3";

import "InvestigationMonsterDetail.proto";

message InvestigationMonster {
	enum LockState {
		LOCK_NONE = 0;
		LOCK_QUEST = 1;
	}

	repeated _InvestigationMonsterDetail _investigation_monster_detail_list = 1149;
	uint32 id = 15;
	LockState lock_state = 10;
	uint32 city_id = 14;
}

syntax = "proto3";

import "ForgeQueueManipulateType.proto";
import "ItemHint.proto";

message ForgeQueueManipulateRsp {
	repeated ItemHint extra_output_item_list = 14;
	repeated ItemHint output_item_list = 9;
	repeated ItemHint return_item_list = 1;
	int32 retcode = 4;
	ForgeQueueManipulateType manipulate_type = 8;
}
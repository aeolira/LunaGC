syntax = "proto3";

import "Vector2Int.proto";

message FilmfestBallGameAction {
	enum _FilmfestBallGameActionType {
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_NONE = 0;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_PLAYER_MOVE = 1;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_SPAWN_WAVE = 2;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_ADD_OBSTACLE = 3;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_REMOVE_OBSTACLE = 4;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_TEAM_SCORE = 5;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_COLLECT_OBSTACLES = 6;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_CHANGE_STAGE = 7;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_CREATE_COLOR_ZONE = 8;
		_FILMFEST_BALL_GAME_ACTION_TYPE_ACTION_TYPE_ADD_RIGHT_PUSH_COUNT = 9;
	}

	_FilmfestBallGameActionType action_type = 1;
	uint64 client_game_time = 2;
	uint64 server_game_time = 3;
	bool is_failed = 4;
	_Vector2Int pos = 5;
	uint32 peer_id = 6;
	uint64 execution_game_time = 7;
	_Vector2Int dir = 8;
	int32 rot = 9;
	repeated uint32 entity_id_list = 10;
	uint32 KMFGABFCHEB = 11;
	bool EOCJOHDBJLL = 12;
	int32 radius = 13;
}

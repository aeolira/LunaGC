syntax = "proto3";


import "_UgcLanV5CardBriefInfo.proto";
import "_UgcLanV5CardRecord.proto";
import "_UgcShortVideoRecord.proto";
import "DKFCFLLEHDF.proto";
import "UgcMusicBriefInfo.proto";
import "UgcMusicRecord.proto";
import "UgcType.proto";

message SaveUgcReq {
	uint32 schedule_id = 15;
	DKFCFLLEHDF NAOAJNMEDDE = 8;
	UgcType ugc_type = 1;
	oneof record {
		_UgcShortVideoRecord short_video_record = 9;
		UgcMusicRecord music_record = 11;
		_UgcLanV5CardRecord lan_v5_card_record = 13;
	}
	oneof brief {
		_UgcLanV5CardBriefInfo lan_v5_card_brief_info = 1985;
		UgcMusicBriefInfo music_brief_info = 391;
	}
}

syntax = "proto3";

import "MathQuaternion.proto";
import "MovingPlatformType.proto";
import "Route.proto";
import "Vector.proto";

message PlatformInfo {
	
	
	
	
	Vector start_pos = 7;
	
	MathQuaternion start_rot = 9;
	
	Vector pos_offset = 11;
	MathQuaternion rot_offset = 12;
	MovingPlatformType moving_platform_type = 13;
	
	Route route = 15;
	
}
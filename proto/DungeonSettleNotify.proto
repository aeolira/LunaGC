		TowerLevelEndNotify tower_level_end_notify = 803;
		
		TeamChainSettleInfo team_chain_settle_info = 820;
		
		
		
		
		
		SummerTimeV2DungeonSettleInfo summer_time_v2_dungeon_settle_info = 918;
		
		CrystalLinkDungeonSettleInfo crystal_link_settle_info = 937;
		
		
		
		
		
		
		RoguelikeDungeonSettleInfo roguelike_dungeon_settle_info = 1055;
		
		
		
		
		
		
		
		
		
		
		InstableSprayDungeonSettleInfo instable_spray_settle_info = 1404;
		
		
		
		
		WindFieldDungeonSettleInfo wind_field_dungeon_settle_info = 1517;
		
		
		EffigyChallengeDungeonResultInfo effigy_challenge_dungeon_result_info = 1625;
		
		
		
		EffigyChallengeV2SettleInfo effigy_challenge_v2_settle_info = 1795;
		
		
		
		
		
		
		
		
	}

syntax = "proto3";


import "QueryFilter.proto";
import "Vector.proto";
import "Vector3Int.proto";

message QueryPathReq {
	enum OptionType {
		OPTION_NONE = 0;
		OPTION_NORMAL = 1;
		OPTION_FIRST_CAN_GO = 2;
	}

	Vector3Int NFPEIPIJKPD = 4;
	Vector source_pos = 7;
	repeated Vector destination_pos = 5;
	Vector3Int ABJELDLCIIA = 12;
	QueryFilter filter = 14;
	uint32 scene_id = 15;
	OptionType query_type = 6;
	int32 query_id = 11;
}

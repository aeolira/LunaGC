# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: LunaGC CI

on:
  workflow_dispatch:
  push:
    branches: [ "6.6.0" ]
  pull_request:
    branches: [ "6.6.0" ]

env:
  RELEASE_TAG: continuous

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew jar

    - name: Upload Server JAR
      uses: actions/upload-artifact@v4
      with:
        name: LunaGC-Server
        path: LunaGC-6.6.0.jar

  build-patch:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Build Patch (Release)
      working-directory: patch
      run: cargo build --release

    - name: Prepare Patch DLL
      run: copy patch\target\release\ext.dll Astrolabe.dll

    - name: Upload Patch DLL
      uses: actions/upload-artifact@v4
      with:
        name: LunaGC-Patch
        path: Astrolabe.dll

  release:
    runs-on: ubuntu-latest
    needs: [build-server, build-patch]
    permissions:
      contents: write

    steps:
    - name: Download Server JAR
      uses: actions/download-artifact@v4
      with:
        name: LunaGC-Server

    - name: Download Patch DLL
      uses: actions/download-artifact@v4
      with:
        name: LunaGC-Patch

    - name: Create/Update Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ env.RELEASE_TAG }}
        name: LunaGC 6.6.0 (Continuous Build)
        body: |
          Automated build from the latest commit.
          - **Server**: `LunaGC-6.6.0.jar`
          - **Patch**: `Astrolabe.dll`
        artifacts: |
          LunaGC-6.6.0.jar
          Astrolabe.dll
        allowUpdates: true
        replacesArtifacts: true
        makeLatest: true
